</head>
<body>
<a class="skip" href="#main" data-i18n="skip">Skip to content</a>

<div class="navwrap container">
  <header class="pill">
    <a class="mark" href="#story" aria-label="Fraudster +1, home" data-i18n="title">Fraudster +1</a>
    <nav class="views" id="nav" aria-label="Views">
      <a href="#story" data-i18n="nav_story">The idea</a>
      <a href="#simulator" data-i18n="nav_sim">Simulator</a>
      <a href="#results" data-i18n="nav_results">Results</a>
      <a href="#real-data" data-i18n="nav_real">Real data</a>

    <div class="tools">

      <div class="lang" role="group" aria-label="Language"><button type="button" data-lang="en" aria-pressed="true">EN</button><button type="button" data-lang="fr" aria-pressed="false">FR</button></div>
    </div>
  </header>
</div>

<main id="main" tabindex="-1">

<!-- ======================================================= THE IDEA (the report) -->
<div id="story" class="view">
  <section class="hero proof" aria-labelledby="h-story">
    <div class="container hero-in">
      <div>
        <h1 id="h-story" data-i18n="rep_title"></h1>
        <p class="lead" id="hero-lede"></p>
        <div class="actions">
          <a class="btn btn--primary" href="#simulator" id="demo" data-i18n="sticker_t"></a>
          <a class="btn" href="#results" data-i18n="hero_cta2"></a>
        </div>
      </div>
      <figure class="stage crop" style="margin:0">
        <div class="stage-sheet">
          <div class="stage-bar">
            <div class="seg" id="hero-rule" role="group" aria-label="Rule"><button type="button" data-preset="10k" data-i18n="preset_10k"></button><button type="button" data-preset="rev4" aria-pressed="true" data-i18n="hero_grades"></button></div>
            <span class="note" id="hero-caption"></span>
          </div>
          <svg id="hero-net" class="net" viewBox="0 0 900 470" role="img" aria-label=""></svg>
          <figcaption class="readout" id="hero-readout" aria-live="polite"></figcaption>
        </div>
      </figure>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-ba">
    <div class="container">
      <div class="head"><h2 id="h-ba" data-i18n="ba_h"></h2><p class="lead" data-i18n="key_p"></p></div>
      <div class="ba">
        <div class="ba-claim">
          <p id="p1"></p>
          <p class="note"><span id="key-real"></span> <a class="cite" href="#real-data" data-i18n="cite_c"></a></p>
        </div>
        <figure class="ba-fig" style="margin:0">
          <div class="bars" id="ba-bars"></div>
          <figcaption class="note"><span class="guide-key" aria-hidden="true"></span><span data-i18n="ba_guide"></span> <span data-i18n="ba_cap"></span></figcaption>
        </figure>
      </div>
    </div>
  </section>

  <section class="sec tight band" aria-labelledby="h-trace">
    <div class="container">
      <div class="head"><h2 id="h-trace" data-i18n="trace_h"></h2><svg class="pathfig" viewBox="0 0 520 120" aria-hidden="true"><g class="pf-l"><path d="M34 60 H118"/><path d="M146 60 C210 60 230 24 300 24"/><path d="M146 60 H300"/><path d="M146 60 C210 60 230 96 300 96"/><path d="M330 24 H420"/><path d="M330 60 H420"/><path d="M330 96 H420"/></g><circle class="pf-ink" cx="22" cy="60" r="14"/><path class="pf-x" d="M15 53 L29 67 M29 53 L15 67"/><rect class="pf-mut" x="118" y="46" width="28" height="28"/><rect class="pf-box" x="300" y="8" width="30" height="104"/><circle class="pf-g1" cx="315" cy="24" r="7"/><circle class="pf-g2" cx="315" cy="60" r="7"/><circle class="pf-g1" cx="315" cy="96" r="7"/><circle class="pf-g1" cx="436" cy="24" r="9"/><circle class="pf-ring" cx="436" cy="24" r="11"/><circle class="pf-g3" cx="436" cy="60" r="9"/><circle class="pf-ring" cx="436" cy="60" r="11"/><circle class="pf-ring" cx="436" cy="60" r="15"/><circle class="pf-g0" cx="436" cy="96" r="9"/></svg></div>
      <ol class="rows">
        <li><h3 data-i18n="s1_h"></h3><p data-i18n="s1_p"></p></li>
        <li><h3 data-i18n="s2_h"></h3><p data-i18n="s2_p"></p></li>
        <li><h3 data-i18n="s3_h"></h3><p data-i18n="s3_p"></p></li>
        <li><h3 data-i18n="s4_h"></h3><p><span data-i18n="s4_p"></span> <a class="cite" href="#simulator" id="cite-a" data-i18n="cite_a"></a></p></li>
      </ol>
    </div>
  </section>

  <section class="sec" aria-labelledby="h-grades">
    <div class="container">
      <div class="head"><h2 id="h-grades" data-i18n="grades_h"></h2><p class="lead" data-i18n="grades_p"></p></div>
      <div class="tablewrap">
        <table class="t gradetable">
          <tbody>
            <tr><th scope="row"><span class="glyph g0" aria-hidden="true"></span><span class="gname">G0</span></th><td data-i18n="g0_d"></td></tr>
            <tr><th scope="row"><span class="glyph g1" aria-hidden="true"></span><span class="gname">G1</span></th><td data-i18n="g1_d"></td></tr>
            <tr><th scope="row"><span class="glyph g2" aria-hidden="true"></span><span class="gname">G2</span></th><td data-i18n="g2_d"></td></tr>
            <tr><th scope="row"><span class="glyph g3" aria-hidden="true"></span><span class="gname">G3</span></th><td data-i18n="g3_d"></td></tr>
          </tbody>
        </table>
      </div>
    </div>
  </section>

  <section class="sec tight proof" aria-labelledby="h-world">
    <div class="container world-split">
      <div class="stage crop">
        <div class="stage-sheet"><canvas id="world-preview" width="960" height="720" role="img" aria-label=""></canvas></div>
      </div>
      <div>
        <h2 id="h-world" data-i18n="world_story_h"></h2>
        <p class="lead" id="world-lead"></p>
        <a class="btn" href="#simulator" id="open-world" data-i18n="world_open"></a>
      </div>
    </div>
  </section>


  <section class="sec tight band" aria-labelledby="h-close">
    <div class="container close">
      <div>
        <h2 id="h-close" data-i18n="close_h"></h2>
        <div class="actions"><a class="btn btn--primary" href="#simulator" data-i18n="open_sim"></a></div>
        <dl class="limits-list"><div><dt data-i18n="honest_h"></dt><dd data-i18n="honest_p"></dd></div><div><dt data-i18n="runs_h"></dt><dd data-i18n="runs_p"></dd></div></dl>
      </div>
      <dl class="close-facts" id="close-facts"></dl>
    </div>
  </section>
</div>

<!-- ======================================================= SIMULATOR -->
<div id="simulator" class="view">
  <div class="container">
    <header class="vhead"><h1 id="h-sim" data-i18n="sim_h"></h1></header>
    <div id="engine" class="engine" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="engine-msg" data-i18n="engine_idle"></span></div>
    <p class="try" data-i18n="try_h"></p>

    <div class="rulebar">
      <span class="lbl" id="lbl-rule" data-i18n="rule_h"></span>
      <div class="seg" id="presets" role="group" aria-labelledby="lbl-rule"><button type="button" data-preset="10k" data-i18n="preset_10k"></button><button type="button" data-preset="rev2" data-i18n="preset_rev2"></button><button type="button" data-preset="rev3" data-i18n="preset_rev3"></button><button type="button" data-preset="rev4" data-i18n="preset_rev4"></button></div>
      <div class="seg" id="vis" role="group" aria-label="Visibility"><button type="button" data-vis="V1" data-i18n="vis_v1"></button><button type="button" data-vis="V3" data-i18n="vis_v3"></button></div>
    </div>
    <p class="note visnote" data-i18n="vis_note"></p>

    <div class="strip tablewrap" id="strip" aria-live="polite"></div>

    <div class="rulebar" style="margin-bottom:var(--space-md)">
      <span class="lbl" id="lbl-view" data-i18n="view_h"></span>
      <div class="seg" id="view-switch" role="group" aria-labelledby="lbl-view"><button type="button" data-view="one" aria-pressed="true" data-i18n="view_one"></button><button type="button" data-view="world" aria-pressed="false" data-i18n="view_world"></button></div>
    </div>

    <div class="simgrid">
      <div class="netpanel">
        <div id="one-view">
          <div class="netbar">
            <label class="field"><span data-i18n="fraud_pick"></span><select id="sel-fraud"></select></label>
            <button class="btn" type="button" id="next-fraud" data-i18n="fraud_next"></button>
            <button class="btn" type="button" id="play" data-i18n="fraud_play"></button>
          </div>
          <div class="netbar">
            <span class="lbl note" id="lbl-color" data-i18n="color_by"></span>
            <div class="seg" id="colorby" role="group" aria-labelledby="lbl-color"><button type="button" data-c="truth" data-i18n="color_truth"></button><button type="button" data-c="grade" data-i18n="color_grade"></button></div>
            <label class="check"><input type="checkbox" id="cb-mist" checked> <span data-i18n="mistakes"></span></label>
          </div>
          <p id="fraud-head" class="fraud-head"></p>
          <p class="note nethint" id="net-hint"></p>
          <div class="netwrap netsheet"><svg id="net" class="net" viewBox="0 0 900 470" role="group" aria-label=""></svg><div class="tip" id="net-tip" hidden></div></div>
          <div id="legend" class="legend"></div>
          <details class="acclist"><summary data-i18n="acc_list"></summary><div class="tablewrap" id="acc-table"></div></details>
        </div>
        <div id="world-view" hidden>
          <p class="world-sum" id="world-sum"></p>
          <div class="netbar canvasbar"><span class="note" id="world-hint" data-i18n="world_hint"></span><span class="grow"></span><button class="btn" type="button" id="world-zoom-in" aria-label="Zoom in">+</button><button class="btn" type="button" id="world-zoom-out" aria-label="Zoom out">−</button><button class="btn" type="button" id="world-reset" data-i18n="reset_view"></button></div>
          <div class="netwrap netsheet"><canvas id="world-canvas" width="1280" height="800" role="img" aria-label=""></canvas><div class="tip" id="world-tip" hidden></div></div>
          <div id="world-legend" class="legend"></div>
          <details class="acclist"><summary data-i18n="world_list"></summary><div class="tablewrap" id="world-table"></div></details>
        </div>
      </div>
      <aside class="card" id="card" aria-live="polite"></aside>
    </div>

    <div style="margin-top:var(--space-2xl)">
      <details class="fold" id="adv">
        <summary><span><span data-i18n="adv_h"></span><small id="adv-sub" data-i18n="adv_sub"></small></span></summary>
        <div class="foldbody">
          <p class="note warn" id="tune-off" hidden data-i18n="tune_off_10k"></p>
          <label class="field"><span data-i18n="sl_g2share"></span> <b class="v" id="v-sigma"></b><input type="range" id="sl-sigma" min="0.01" max="0.5" step="0.01"></label>
          <label class="field"><span data-i18n="sl_kappa"></span> <b class="v" id="v-kappa"></b><input type="range" id="sl-kappa" min="0.05" max="0.95" step="0.05"></label>
          <label class="field"><span data-i18n="sl_pi"></span> <b class="v" id="v-pi"></b><input type="range" id="sl-pi" min="0.1" max="1" step="0.05"></label>
          <label class="check"><input type="checkbox" id="cb-fan"> <span data-i18n="sl_fan"></span></label>
          <label class="field"><span data-i18n="sl_fank"></span> <b class="v" id="v-fank"></b><input type="range" id="sl-fank" min="1" max="5" step="1"></label>
          <label class="field"><span data-i18n="sl_fandt"></span> <b class="v" id="v-fandt"></b><input type="range" id="sl-fandt" min="1" max="168" step="1"></label>
          <label class="field"><span data-i18n="sl_fanr"></span> <b class="v" id="v-fanr"></b><input type="range" id="sl-fanr" min="1.1" max="5" step="0.1"></label>
          <p class="note warn" id="custom-note" hidden data-i18n="custom_note"></p>
          <button class="link" type="button" id="reset" data-i18n="reset"></button>
        </div>
      </details>
      <details class="fold" id="worldbox">
        <summary><span><span data-i18n="world_sum"></span><small data-i18n="world_sub"></small></span></summary>
        <div class="foldbody">
          <label class="field"><span data-i18n="world_frauds"></span> <b class="v" id="v-frauds"></b><input type="range" id="sl-frauds" min="10" max="80" step="5" value="40"></label>
          <div class="field"><span data-i18n="world_mules"></span> <b class="v" id="v-mules"></b>
            <div style="display:grid;grid-template-columns:1fr 1fr;gap:var(--space-sm)"><input type="range" id="sl-kmin" min="2" max="10" step="1" value="2" aria-label="minimum mules"><input type="range" id="sl-kmax" min="2" max="10" step="1" value="10" aria-label="maximum mules"></div></div>
          <label class="field"><span data-i18n="world_window"></span>
            <select id="sel-window"><option value="random" data-i18n="window_random"></option><option value="1">1 h</option><option value="6">6 h</option><option value="24">24 h</option><option value="72">72 h</option><option value="168">7 d</option></select></label>
          <label class="field" id="lab-spread"><span data-i18n="world_spread"></span> <b class="v" id="v-spread"></b><input type="range" id="sl-spread" min="0" max="0.8" step="0.1" value="0.2"></label>
          <label class="field"><span data-i18n="world_cex"></span> <b class="v" id="v-cex"></b><input type="range" id="sl-cex" min="0.1" max="1" step="0.05" value="0.3"></label>
          <label class="field"><span data-i18n="world_blacklist"></span>
            <select id="sel-blacklist"><option value="old" data-i18n="bl_old"></option><option value="alert" data-i18n="bl_alert" selected></option><option value="freeze" data-i18n="bl_freeze"></option></select></label>
          <label class="field"><span data-i18n="world_eval"></span>
            <select id="sel-eval"><option value="end" data-i18n="eval_end"></option><option value="1" data-i18n="eval_1"></option><option value="7" data-i18n="eval_7"></option><option value="30" data-i18n="eval_30"></option><option value="90" data-i18n="eval_90" selected></option></select></label>
          <p class="note" data-i18n="eval_note"></p>
          <fieldset><legend data-i18n="world_patterns"></legend><div id="pat-boxes" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(14rem,1fr));gap:0 var(--space-md)"></div></fieldset>
          <p style="margin-top:var(--space-md)"><button class="btn btn--primary" type="button" id="new-world" data-i18n="world_new"></button></p>
          <div class="note" id="world-info" role="status" aria-live="polite" style="margin-top:var(--space-sm)"></div>
        </div>
      </details>
    </div>

    <h2 class="subhead" data-i18n="met_all"></h2>
    <div class="mgrid" id="metrics"></div>
    <div class="roles" id="roles"></div>
    <p class="note" data-i18n="met_one_world" style="margin-block:var(--space-lg) var(--section-gap-s)"></p>
  </div>
</div>

<!-- ======================================================= RESULTS -->
<div id="results" class="view">
  <div class="container" style="padding-bottom:var(--section-gap-s)">
    <header class="vhead"><h1 id="h-res" data-i18n="res_h"></h1><p class="lead" data-i18n="res_intro"></p></header>
    <div class="tablewrap" id="res-table"></div>
    <p class="note" data-i18n="res_rev3_note"></p>
    <div class="figs">
      <figure class="fig"><figcaption><b id="cap-main"></b><span data-i18n="res_main_p"></span></figcaption><div class="chart"><canvas id="ch-main" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig"><figcaption><b id="cap-time"></b><span data-i18n="res_time_p"></span></figcaption><div class="chart"><canvas id="ch-time" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig"><figcaption><b id="cap-role"></b></figcaption><div class="chart"><canvas id="ch-role" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig wide"><figcaption><b id="cap-pattern"></b></figcaption><div class="chart"><canvas id="ch-pattern" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig"><figcaption><b id="cap-speed"></b><span data-i18n="res_speed_p"></span></figcaption><div class="chart"><canvas id="ch-speed" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig"><figcaption><b id="cap-k"></b><span data-i18n="res_k_p"></span></figcaption><div class="chart"><canvas id="ch-k" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
    </div>
  </div>
</div>

<!-- ======================================================= REAL DATA -->
<div id="real-data" class="view">
  <div class="container" style="padding-bottom:var(--section-gap-s)">
    <header class="vhead"><h1 id="h-real" data-i18n="real_h"></h1><p class="lead" data-i18n="real_intro"></p></header>
    <div class="notice crop"><h2 data-i18n="real_notice_h"></h2><p data-i18n="real_notice_p"></p></div>
    <div class="tablewrap" id="real-kpis"></div>
    <div class="figs">
      <figure class="fig"><figcaption><b id="cap-flow"></b></figcaption><div class="chart"><canvas id="ch-flow" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <figure class="fig"><figcaption><b id="cap-ex"></b></figcaption><div class="chart"><canvas id="ch-ex" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <div class="fig"><div class="tablewrap" id="real-roles"></div></div>
      <div class="fig"><div class="tablewrap" id="real-grades"></div></div>
      <figure class="fig"><figcaption><b id="cap-check"></b><span data-i18n="real_check_p"></span></figcaption><div class="chart"><canvas id="ch-check" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
      <div class="fig"><h2 class="subhead" style="margin-top:0" data-i18n="real_fan_h"></h2><p id="real-fan"></p></div>
      <div class="fig wide"><div class="tablewrap" id="real-g3"></div></div>
      <div class="fig wide"><div class="tablewrap" id="real-tau"></div><p class="note" data-i18n="real_tau_p" style="max-width:72ch"></p></div>
      <figure class="fig wide"><figcaption><b id="cap-reach"></b><span data-i18n="real_reach_p"></span></figcaption><div class="chart"><canvas id="ch-reach" role="img" aria-label="Chart"></canvas><div class="sr-only"></div></div></figure>
    </div>
    <div class="limits"><h2 data-i18n="real_limits_h"></h2><ul id="real-limits"></ul></div>
  </div>
</div>

<!-- ======================================================= DATA EXPLAINED -->
<div id="data" class="view">
  <div class="container" style="padding-bottom:var(--section-gap-s)">
    <header class="vhead"><h1 id="h-data" data-i18n="data_h"></h1><p class="lead" data-i18n="data_intro"></p></header>
    <div class="tablewrap" id="cols"></div>
    <div class="tablewrap" id="rows"></div>
    <div class="cols2">
      <div><h2 data-i18n="data_patterns_h"></h2><ul id="pat-list"></ul></div>
      <div><h2 data-i18n="data_roles_h"></h2><ul id="role-list"></ul></div>
    </div>
  </div>
</div>

<!-- ======================================================= SOURCES -->
<div id="sources" class="view">
  <div class="container" style="padding-bottom:var(--section-gap-s)">

    <ol class="sources" id="src-list"></ol>
  </div>
</div>

<!-- ======================================================= ASK CLAUDE -->
<div id="ask" class="ask" role="dialog" aria-labelledby="ask-title" hidden>
  <div class="askhead"><h2 id="ask-title" data-i18n="ask_h"></h2><button class="link" type="button" id="ask-close" data-i18n="close"></button></div>
  <div class="askkey">
    <label class="field"><span data-i18n="ask_key"></span><input type="password" id="ask-key" autocomplete="off" placeholder="sk-ant-…"></label>
    <label class="check"><input type="checkbox" id="ask-remember"> <span data-i18n="ask_remember"></span></label>

  </div>
  <div id="ask-log" class="asklog" aria-live="polite"></div>

</div>
