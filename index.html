<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fraudster +1 · following stolen crypto into exchange accounts</title>
<meta name="description" content="Interactive simulator and results: finding the accounts involved in a crypto fraud, from a blacklisted address to exchange accounts.">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<header class="top">
  <div class="brand"><span class="logo">F+1</span><span data-i18n="title">Fraudster +1</span></div>
  <nav id="nav">
    <a href="#story" data-i18n="nav_story">The idea</a>
    <a href="#simulator" data-i18n="nav_sim">Simulator</a>
    <a href="#results" data-i18n="nav_results">Results</a>
    <a href="#real-data" data-i18n="nav_real">Real data</a>
    <a href="#data" data-i18n="nav_data">Data explained</a>
    <a href="#sources" data-i18n="nav_about">Sources</a>
  </nav>
  <div class="lang"><button data-lang="en" class="on">EN</button><button data-lang="fr">FR</button></div>
</header>

<!-- ======================================================= THE IDEA -->
<section id="story" class="page">
  <div class="hero">
    <h1 data-i18n="title">Fraudster +1</h1>
    <p class="tagline" data-i18n="tagline"></p>
  </div>
  <h2 data-i18n="story_h"></h2>
  <div class="steps">
    <div class="step"><svg viewBox="0 0 120 70" aria-hidden="true"><circle cx="60" cy="35" r="20" class="n-seed"/><path d="M48 23 L72 47 M72 23 L48 47" class="cross"/></svg><h3 data-i18n="s1_h"></h3><p data-i18n="s1_p"></p></div>
    <div class="step"><svg viewBox="0 0 120 70" aria-hidden="true"><circle cx="18" cy="35" r="11" class="n-seed"/><path d="M30 35 C55 10 70 10 95 18 M30 35 C55 35 70 35 95 35 M30 35 C55 60 70 60 95 52" class="flow"/><rect x="95" y="10" width="18" height="50" rx="4" class="n-exch"/></svg><h3 data-i18n="s2_h"></h3><p data-i18n="s2_p"></p></div>
    <div class="step"><svg viewBox="0 0 120 70" aria-hidden="true"><rect x="10" y="40" width="14" height="20" class="b-gray"/><rect x="30" y="34" width="14" height="26" class="b-gray"/><rect x="50" y="44" width="14" height="16" class="b-gray"/><rect x="70" y="10" width="14" height="50" class="b-red"/><rect x="90" y="38" width="14" height="22" class="b-gray"/><line x1="4" y1="22" x2="116" y2="22" class="thr"/></svg><h3 data-i18n="s3_h"></h3><p data-i18n="s3_p"></p></div>
    <div class="step"><svg viewBox="0 0 120 70" aria-hidden="true"><circle cx="20" cy="35" r="10" class="g0"/><circle cx="47" cy="35" r="10" class="g1"/><circle cx="74" cy="35" r="10" class="g2"/><circle cx="101" cy="35" r="10" class="g3"/><text x="20" y="62" class="gl">G0</text><text x="47" y="62" class="gl">G1</text><text x="74" y="62" class="gl">G2</text><text x="101" y="62" class="gl">G3</text></svg><h3 data-i18n="s4_h"></h3><p data-i18n="s4_p"></p></div>
  </div>
  <h2 data-i18n="grades_h"></h2>
  <div class="grades">
    <div class="gr"><span class="chip c0">G0</span><span data-i18n="g0_d"></span></div>
    <div class="gr"><span class="chip c1">G1</span><span data-i18n="g1_d"></span></div>
    <div class="gr"><span class="chip c2">G2</span><span data-i18n="g2_d"></span></div>
    <div class="gr"><span class="chip c3">G3</span><span data-i18n="g3_d"></span></div>
  </div>
  <h2 data-i18n="key_h"></h2>
  <div class="kpis" id="kpis"></div>
  <p class="note" id="key-real"></p>
  <p><a class="btn" href="#simulator" data-i18n="open_sim">Open the simulator</a></p>
  <div class="honest"><h3 data-i18n="honest_h"></h3><p data-i18n="honest_p"></p></div>
</section>

<!-- ======================================================= SIMULATOR -->
<section id="simulator" class="page">
  <h2 data-i18n="sim_h">Simulator</h2>
  <div id="engine" class="engine"><span class="dot"></span><span id="engine-msg" data-i18n="engine_loading"></span></div>
  <div class="simgrid">
    <aside class="panel controls">
      <h3 data-i18n="rule_h"></h3>
      <div class="seg" id="presets"><button data-preset="10k" data-i18n="preset_10k"></button><button data-preset="rev2" data-i18n="preset_rev2"></button><button data-preset="rev3" class="on" data-i18n="preset_rev3"></button></div>
      <div class="seg" id="vis"><button data-vis="V1" data-i18n="vis_v1"></button><button data-vis="V3" class="on" data-i18n="vis_v3"></button></div>
      <details id="adv"><summary data-i18n="adv_h"></summary>
        <label><span data-i18n="sl_g2share"></span> <b id="v-sigma"></b><input type="range" id="sl-sigma" min="0.01" max="0.5" step="0.01"></label>
        <label><span data-i18n="sl_kappa"></span> <b id="v-kappa"></b><input type="range" id="sl-kappa" min="0.05" max="0.95" step="0.05"></label>
        <label><span data-i18n="sl_pi"></span> <b id="v-pi"></b><input type="range" id="sl-pi" min="0.1" max="1" step="0.05"></label>
        <label class="row"><input type="checkbox" id="cb-fan"> <span data-i18n="sl_fan"></span></label>
        <label><span data-i18n="sl_fank"></span> <b id="v-fank"></b><input type="range" id="sl-fank" min="1" max="5" step="1"></label>
        <label><span data-i18n="sl_fandt"></span> <b id="v-fandt"></b><input type="range" id="sl-fandt" min="1" max="168" step="1"></label>
        <label><span data-i18n="sl_fanr"></span> <b id="v-fanr"></b><input type="range" id="sl-fanr" min="1.1" max="5" step="0.1"></label>
        <p class="note warn" id="custom-note" hidden data-i18n="custom_note"></p>
        <button class="link" id="reset" data-i18n="reset"></button>
      </details>
      <h3 data-i18n="world_h"></h3>
      <label><span data-i18n="world_frauds"></span> <b id="v-frauds"></b><input type="range" id="sl-frauds" min="10" max="80" step="5" value="40"></label>
      <label><span data-i18n="world_mules"></span> <b id="v-mules"></b>
        <span class="two"><input type="range" id="sl-kmin" min="2" max="10" step="1" value="2"><input type="range" id="sl-kmax" min="2" max="10" step="1" value="10"></span></label>
      <label><span data-i18n="world_window"></span> <b id="v-window"></b>
        <select id="sel-window"><option value="random" data-i18n="window_random"></option><option value="1">1 h</option><option value="6">6 h</option><option value="24">24 h</option><option value="72">72 h</option><option value="168">7 d</option></select></label>
      <label id="lab-spread"><span data-i18n="world_spread"></span> <b id="v-spread"></b><input type="range" id="sl-spread" min="0" max="0.8" step="0.1" value="0.2"></label>
      <label><span data-i18n="world_cex"></span> <b id="v-cex"></b><input type="range" id="sl-cex" min="0.1" max="1" step="0.05" value="0.3"></label>
      <fieldset><legend data-i18n="world_patterns"></legend><div id="pat-boxes" class="pats"></div></fieldset>
      <button class="btn wide" id="new-world" data-i18n="world_new"></button>
      <p class="note" id="world-info"></p>
    </aside>

    <div class="panel netpanel">
      <div class="netbar">
        <label><span data-i18n="fraud_pick"></span> <select id="sel-fraud"></select></label>
        <button class="small" id="next-fraud" data-i18n="fraud_next"></button>
        <button class="small" id="play" data-i18n="fraud_play"></button>
        <span class="sp"></span>
        <span data-i18n="color_by"></span>
        <div class="seg small" id="colorby"><button data-c="truth" data-i18n="color_truth"></button><button data-c="grade" class="on" data-i18n="color_grade"></button></div>
        <label class="row"><input type="checkbox" id="cb-mist" checked> <span data-i18n="mistakes"></span></label>
      </div>
      <div id="fraud-head" class="fraud-head"></div>
      <svg id="net" viewBox="0 0 900 470" role="img" aria-label="network of one fraud"></svg>
      <div id="legend" class="legend"></div>
    </div>

    <aside class="panel card" id="card"><h3 data-i18n="card_h"></h3><p class="note" data-i18n="card_empty"></p></aside>
  </div>

  <div class="metrics panel">
    <h3 data-i18n="met_h"></h3>
    <div class="mgrid" id="metrics"></div>
    <div class="roles" id="roles"></div>
    <p class="note" data-i18n="met_one_world"></p>
  </div>
</section>

<!-- ======================================================= RESULTS -->
<section id="results" class="page">
  <h2 data-i18n="res_h"></h2>
  <p data-i18n="res_intro"></p>
  <div class="charts">
    <div class="chartbox"><h3 data-i18n="res_main_h"></h3><p class="note" data-i18n="res_main_p"></p><canvas id="ch-main"></canvas></div>
    <div class="chartbox"><h3 data-i18n="res_role_h"></h3><canvas id="ch-role"></canvas></div>
    <div class="chartbox"><h3 data-i18n="res_pattern_h"></h3><canvas id="ch-pattern"></canvas></div>
    <div class="chartbox"><h3 data-i18n="res_speed_h"></h3><p class="note" data-i18n="res_speed_p"></p><canvas id="ch-speed"></canvas></div>
    <div class="chartbox"><h3 data-i18n="res_k_h"></h3><p class="note" data-i18n="res_k_p"></p><canvas id="ch-k"></canvas></div>
    <div class="chartbox"><h3 data-i18n="res_table_h"></h3><div id="res-table"></div></div>
  </div>
</section>

<!-- ======================================================= REAL DATA -->
<section id="real-data" class="page">
  <h2 data-i18n="real_h"></h2>
  <p data-i18n="real_intro"></p>
  <div class="kpis" id="real-kpis"></div>
  <div class="charts">
    <div class="chartbox"><h3 data-i18n="real_flow_h"></h3><canvas id="ch-flow"></canvas></div>
    <div class="chartbox"><h3 data-i18n="real_roles_h"></h3><div id="real-roles"></div><h3 data-i18n="real_ex_h"></h3><canvas id="ch-ex"></canvas></div>
    <div class="chartbox"><h3 data-i18n="real_grades_h"></h3><div id="real-grades"></div></div>
    <div class="chartbox"><h3 data-i18n="real_check_h"></h3><p class="note" data-i18n="real_check_p"></p><canvas id="ch-check"></canvas></div>
    <div class="chartbox"><h3 data-i18n="real_fan_h"></h3><p id="real-fan"></p></div>
    <div class="chartbox"><h3 data-i18n="real_g3_h"></h3><div id="real-g3" class="scroll"></div></div>
  </div>
  <div class="honest"><h3 data-i18n="real_limits_h"></h3><ul id="real-limits"></ul></div>
</section>

<!-- ======================================================= DATA -->
<section id="data" class="page">
  <h2 data-i18n="data_h"></h2>
  <p data-i18n="data_intro"></p>
  <h3 data-i18n="data_cols_h"></h3><div id="cols"></div>
  <h3 data-i18n="data_rows_h"></h3><div id="rows" class="scroll"></div>
  <div class="two-col">
    <div><h3 data-i18n="data_patterns_h"></h3><ul id="pat-list"></ul></div>
    <div><h3 data-i18n="data_roles_h"></h3><ul id="role-list"></ul></div>
  </div>
</section>

<!-- ======================================================= SOURCES -->
<section id="sources" class="page">
  <h2 data-i18n="about_h"></h2>
  <p data-i18n="about_code"></p>
  <ul class="sources" id="src-list"></ul>
</section>

<!-- ======================================================= CLAUDE -->
<button id="ask-open" class="askbtn" data-i18n="ask">Ask Claude</button>
<div id="ask" class="ask" hidden>
  <div class="askhead"><b data-i18n="ask_h"></b><button class="link" id="ask-close" data-i18n="close"></button></div>
  <div class="askkey">
    <label><span data-i18n="ask_key"></span><input type="password" id="ask-key" autocomplete="off" placeholder="sk-ant-…"></label>
    <label class="row"><input type="checkbox" id="ask-remember"> <span data-i18n="ask_remember"></span></label>
    <p class="note" data-i18n="ask_key_note"></p>
  </div>
  <div id="ask-log" class="asklog"></div>
  <form id="ask-form"><textarea id="ask-in" rows="3"></textarea><button class="btn" data-i18n="ask_send"></button></form>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<script src="js/i18n.js"></script>
<script src="js/net.js"></script>
<script src="js/app.js"></script>
<script src="js/claude.js"></script>
</body>
</html>
