  <div class="para"><span class="pn">¶ 2</span><p data-i18n="s1_p"></p></div>
  <div class="para"><span class="pn">¶ 3</span><p data-i18n="s2_p"></p></div>
  <div class="para"><span class="pn">¶ 4</span><p><span data-i18n="s3_p"></span> <span data-i18n="s4_p"></span> <a class="cite" href="#simulator" id="cite-a" data-i18n="cite_a"></a></p></div>

<!-- ======================================================= EXHIBIT A: SIMULATOR -->
<section id="simulator" class="page" aria-labelledby="h-sim">
  <div class="caption"><span data-i18n="exhibit_a"></span><span>FP1-A</span></div>
  <h1 class="xtitle" id="h-sim"><span data-i18n="sim_h"></span></h1>
  <div id="engine" class="engine" role="status" aria-live="polite"><i aria-hidden="true"></i><span id="engine-msg" data-i18n="engine_idle"></span></div>
  <p><span class="try" data-i18n="try_h"></span></p>

  <div class="rulebar">
    <span class="lbl" id="lbl-rule" data-i18n="rule_h"></span>
    <div class="seg" id="presets" role="group" aria-labelledby="lbl-rule"><button data-preset="10k" data-i18n="preset_10k"></button><button data-preset="rev2" data-i18n="preset_rev2"></button><button data-preset="rev3" data-i18n="preset_rev3"></button></div>
    <div class="seg" id="vis" role="group" aria-label="Visibility"><button data-vis="V1" data-i18n="vis_v1"></button><button data-vis="V3" data-i18n="vis_v3"></button></div>
  </div>
  <p class="note visnote" data-i18n="vis_note"></p>

  <div class="strip tablewrap" id="strip" aria-live="polite"></div>

  <div class="simgrid">
    <div class="netpanel">
      <div class="netbar">
        <label class="field"><span data-i18n="fraud_pick"></span><select id="sel-fraud"></select></label>
        <button class="btn ghost" id="next-fraud" data-i18n="fraud_next"></button>
        <button class="btn ghost" id="play" data-i18n="fraud_play"></button>
      </div>
      <div class="netbar">
        <span class="lbl note" id="lbl-color" data-i18n="color_by"></span>
        <div class="seg" id="colorby" role="group" aria-labelledby="lbl-color"><button data-c="truth" data-i18n="color_truth"></button><button data-c="grade" data-i18n="color_grade"></button></div>
        <label class="check"><input type="checkbox" id="cb-mist" checked> <span data-i18n="mistakes"></span></label>
      </div>
      <p id="fraud-head" class="fraud-head"></p>
      <p class="note nethint" id="net-hint"></p>
      <div class="netwrap"><svg id="net" viewBox="0 0 900 470" role="group" aria-label=""></svg></div>
      <div id="legend" class="legend"></div>
      <details class="acclist"><summary data-i18n="acc_list"></summary><div class="tablewrap" id="acc-table"></div></details>
    </div>
    <aside class="card" id="card" aria-live="polite"></aside>
  </div>

  <details class="fold" id="adv">
    <summary><span><span data-i18n="adv_h"></span><small id="adv-sub" data-i18n="adv_sub"></small></span></summary>
    <div class="foldbody">
      <p class="note warn" id="tune-off" hidden data-i18n="tune_off_10k"></p>
      <label class="field"><span data-i18n="sl_g2share"></span> <b class="v" id="v-sigma"></b><input type="range" id="sl-sigma" min="0.01" max="0.5" step="0.01"></label>
      <label class="field"><span data-i18n="sl_kappa"></span> <b class="v" id="v-kappa"></b><input type="range" id="sl-kappa" min="0.05" max="0.95" step="0.05"></label>
      <label class="field"><span data-i18n="sl_pi"></span> <b class="v" id="v-pi"></b><input type="range" id="sl-pi" min="0.1" max="1" step="0.05"></label>
      <label class="check"><input type="checkbox" id="cb-fan"> <span data-i18n="sl_fan"></span></label>
      <label class="field"><span data-i18n="sl_fank"></span> <b class="v" id="v-fank"></b><input type="range" id="sl-fank" min="1" max="5" step="1"></label>
      <label class="field"><span data-i18n="sl_fandt"></span> <b class="v" id="v-fandt"></b><input type="range" id="sl-fandt" min="1" max="168" step="1"></label>
      <label class="field"><span data-i18n="sl_fanr"></span> <b class="v" id="v-fanr"></b><input type="range" id="sl-fanr" min="1.1" max="5" step="0.1"></label>
      <p class="note warn" id="custom-note" hidden data-i18n="custom_note"></p>
      <button class="link" id="reset" data-i18n="reset"></button>
    </div>
  </details>

  <details class="fold" id="worldbox">
    <summary><span><span data-i18n="world_sum"></span><small data-i18n="world_sub"></small></span></summary>
    <div class="foldbody">
      <label class="field"><span data-i18n="world_frauds"></span> <b class="v" id="v-frauds"></b><input type="range" id="sl-frauds" min="10" max="80" step="5" value="40"></label>
      <div class="field"><span data-i18n="world_mules"></span> <b class="v" id="v-mules"></b>
        <div class="two"><label>min<input type="range" id="sl-kmin" min="2" max="10" step="1" value="2" aria-label="minimum mules"></label><label>max<input type="range" id="sl-kmax" min="2" max="10" step="1" value="10" aria-label="maximum mules"></label></div></div>
      <label class="field"><span data-i18n="world_window"></span>
        <select id="sel-window"><option value="random" data-i18n="window_random"></option><option value="1">1 h</option><option value="6">6 h</option><option value="24">24 h</option><option value="72">72 h</option><option value="168">7 d</option></select></label>
      <label class="field" id="lab-spread"><span data-i18n="world_spread"></span> <b class="v" id="v-spread"></b><input type="range" id="sl-spread" min="0" max="0.8" step="0.1" value="0.2"></label>
      <label class="field"><span data-i18n="world_cex"></span> <b class="v" id="v-cex"></b><input type="range" id="sl-cex" min="0.1" max="1" step="0.05" value="0.3"></label>
      <fieldset><legend data-i18n="world_patterns"></legend><div id="pat-boxes" class="pats"></div></fieldset>
      <p><button class="btn" id="new-world" data-i18n="world_new"></button></p>
      <div class="note" id="world-info" role="status" aria-live="polite"></div>
    </div>
  </details>

  <h2 class="sec" data-i18n="met_all"></h2>
  <div class="mgrid" id="metrics"></div>
  <div class="roles" id="roles"></div>
  <p class="note" data-i18n="met_one_world"></p>
</section>

<!-- ======================================================= EXHIBIT B: RESULTS -->
<section id="results" class="page" aria-labelledby="h-res">

  <p class="sub" data-i18n="res_intro"></p>

  <div class="figs">
    <figure class="fig"><figcaption><b id="cap-main"></b><span data-i18n="res_main_p"></span></figcaption><div class="chart"><canvas id="ch-main"></canvas></div></figure>
    <figure class="fig"><figcaption><b id="cap-role"></b></figcaption><div class="chart"><canvas id="ch-role"></canvas></div></figure>
    <figure class="fig wide"><figcaption><b id="cap-pattern"></b></figcaption><div class="chart"><canvas id="ch-pattern"></canvas></div></figure>
    <figure class="fig"><figcaption><b id="cap-speed"></b><span data-i18n="res_speed_p"></span></figcaption><div class="chart"><canvas id="ch-speed"></canvas></div></figure>
    <figure class="fig"><figcaption><b id="cap-k"></b><span data-i18n="res_k_p"></span></figcaption><div class="chart"><canvas id="ch-k"></canvas></div></figure>
  </div>
</section>

<section id="real-data" class="page" aria-labelledby="h-real">
  <div class="caption"><span data-i18n="exhibit_c"></span><span>FP1-C</span></div>
  <h1 class="xtitle" id="h-real"><span data-i18n="real_h"></span></h1>
  <div class="notice"><h2 data-i18n="real_notice_h"></h2><p data-i18n="real_notice_p"></p></div>
  <p class="sub" data-i18n="real_intro"></p>

  <div class="figs">
    <figure class="fig"><figcaption><b id="cap-flow"></b></figcaption><div class="chart"><canvas id="ch-flow"></canvas></div></figure>
    <figure class="fig"><figcaption><b id="cap-ex"></b></figcaption><div class="chart"><canvas id="ch-ex"></canvas></div></figure>
    <div class="fig"><div class="tablewrap" id="real-roles"></div></div>
    <div class="fig"><div class="tablewrap" id="real-grades"></div></div>
    <figure class="fig"><figcaption><b id="cap-check"></b><span data-i18n="real_check_p"></span></figcaption><div class="chart"><canvas id="ch-check"></canvas></div></figure>
    <div class="fig"><h2 class="sec" style="margin-top:0" data-i18n="real_fan_h"></h2><p id="real-fan" class="read"></p></div>
    <div class="fig wide"><div class="tablewrap" id="real-g3"></div></div>
  </div>
  <div class="limits"><h2 data-i18n="real_limits_h"></h2><ul id="real-limits"></ul></div>
</section>

  <div class="caption"><span data-i18n="exhibit_d"></span><span>FP1-D</span></div>
  <h1 class="xtitle" id="h-data"><span data-i18n="data_h"></span></h1>
  <p class="sub" data-i18n="data_intro"></p>
  <div class="tablewrap" id="cols"></div>
  <div class="tablewrap" id="rows"></div>
  <div class="cols2">
    <div><h2 class="sec" data-i18n="data_patterns_h"></h2><ul id="pat-list"></ul></div>
    <div><h2 class="sec" data-i18n="data_roles_h"></h2><ul id="role-list"></ul></div>
  </div>
</section>

<!-- ======================================================= EXHIBIT E: SOURCES -->

</section>
